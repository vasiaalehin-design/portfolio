<style>
.project-page { padding-top: 42px; padding-bottom: 100px; }

.project-header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 2rem;
  padding: 40px 30px 32px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 40px;
}
.project-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.95;
  text-transform: uppercase;
}
.project-meta { text-align: right; }
.project-meta p { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; color: var(--muted); line-height: 1.7; }
.project-meta p strong { color: var(--text); font-weight: 400; }

/* ── IMAGE BLOCKS ── */
.project-images { display: flex; flex-direction: column; gap: 30px; }

/* Full width */
.block-full { padding: 0 30px; }
.block-full img { width: 100%; height: auto; display: block; cursor: zoom-in; transition: opacity 0.3s ease; }
.block-full img:hover { opacity: 0.92; }

/* Carousel */
.block-carousel { overflow: hidden; padding: 0 30px; }
.carousel-track {
  display: flex;
  gap: 30px;
  user-select: none;
  transition: transform 0.05s linear;
}
.carousel-track.is-dragging { cursor: grabbing; }
.carousel-track img {
  flex-shrink: 0;
  height: 420px;
  width: auto;
  display: block;
  cursor: grab;
  transition: opacity 0.3s ease;
}
.carousel-track img:hover { opacity: 0.92; }

/* 2x2 grid */
.block-grid2x2 { padding: 0 30px; }
.grid2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.grid2x2 img { width: 100%; height: auto; display: block; cursor: zoom-in; transition: opacity 0.3s ease; }
.grid2x2 img:hover { opacity: 0.92; }

/* 2 col row */
.block-2col { padding: 0 30px; }
.row2col { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.row2col img { width: 100%; height: auto; display: block; cursor: zoom-in; transition: opacity 0.3s ease; }
.row2col img:hover { opacity: 0.92; }

/* 3 col row */
.block-3col { padding: 0 30px; }
.row3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; }
.row3col img { width: 100%; height: auto; display: block; cursor: zoom-in; transition: opacity 0.3s ease; }
.row3col img:hover { opacity: 0.92; }

.project-desc {
  margin-top: 48px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  padding: 32px 30px 0;
  border-top: 1px solid var(--border);
}
.project-desc h3 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.project-desc p { font-size: 13px; line-height: 1.85; color: #444; }

.back-link {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px; color: var(--muted); text-decoration: none;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin: 60px 0 0 30px; transition: color .2s; display: block;
}
.back-link:hover { color: var(--text); }
.back-link::before { content: '← '; }

.next-project { display: flex; justify-content: flex-end; margin-top: 80px; padding: 32px 30px 0; border-top: 1px solid var(--border); }
.next-link { text-decoration: none; color: var(--text); text-align: right; }
.next-link span { display: block; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.next-link h3 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; text-transform: uppercase; transition: opacity .2s; }
.next-link:hover h3 { opacity: 0.5; }

/* reveal home */
.home-preview { position: fixed; bottom: 0; left: 0; right: 0; height: 100vh; z-index: 0; overflow: hidden; }
.home-preview iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
.project-page { position: relative; z-index: 1; background: var(--bg); }
nav { z-index: 10; }
.page-wrapper { position: relative; z-index: 1; background: var(--bg); will-change: transform; }

.lightbox { display: none; position: fixed; inset: 0; background: rgba(250,249,247,0.97); z-index: 999; align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
.lightbox-close { position: fixed; top: 18px; right: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); cursor: pointer; background: none; border: none; }
.lightbox-close:hover { color: var(--text); }

@media (max-width: 700px) {
  .project-header { grid-template-columns: 1fr; padding: 30px 20px 24px; }
  .project-meta { text-align: left; }
  .grid2x2, .row2col, .row3col { grid-template-columns: 1fr; }
  .carousel-track img { height: 260px; }
  .project-desc { grid-template-columns: 1fr; gap: 24px; padding: 24px 30px 0; }
  .next-project { padding: 24px 30px 0; }
}

const id = 7; // hardcoded for /rainbow
const p = projects[id] || projects[1];
const ids = Object.keys(projects).map(Number);
const nextId = ids[(ids.indexOf(id) + 1) % ids.length];
const next = projects[nextId];

document.getElementById('proj-title').textContent = p.title + ' (' + p.year + ')';
document.getElementById('proj-meta').innerHTML =
  `<p><strong>${p.cat}</strong></p><p>${p.sub}</p><p style="margin-top:8px">Client: ${p.client}</p>`;
document.getElementById('proj-details').innerHTML =
  `Year: ${p.year}<br>Category: ${p.cat}<br>Tools: ${p.tools}`;
document.title = p.title + ' — Vasily Alekhin';

const container = document.getElementById('proj-images');

function makeImg(src, zoomable) {
  const img = document.createElement('img');
  img.src = src; img.alt = '';
  if (zoomable) img.onclick = () => openLightbox(src);
  return img;
}

function makeCarousel(imgs) {
  const wrap = document.createElement('div');
  wrap.className = 'block-carousel';
  const track = document.createElement('div');
  track.className = 'carousel-track';
  imgs.forEach(src => {
    const img = makeImg(src, false);
    track.appendChild(img);
  });
  wrap.appendChild(track);

  // drag + touch logic
  let startX = 0, offset = 0, dragOffset = 0, dragging = false, moved = false;

  function onStart(clientX) {
    dragging = true; moved = false;
    startX = clientX;
    dragOffset = offset;
    track.classList.add('is-dragging');
  }
  function onMove(clientX) {
    if (!dragging) return;
    const dx = clientX - startX;
    if (Math.abs(dx) > 4) moved = true;
    const maxOffset = track.scrollWidth - wrap.clientWidth;
    offset = Math.max(0, Math.min(dragOffset - dx, maxOffset));
    track.style.transform = `translateX(-${offset}px)`;
  }
  function onEnd(target) {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('is-dragging');
    if (!moved && target) {
      const img = target.closest('img');
      if (img) openLightbox(img.src);
    }
  }

  // Mouse
  track.addEventListener('mousedown', e => { onStart(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove', e => onMove(e.clientX));
  window.addEventListener('mouseup', e => onEnd(e.target));

  // Touch
  track.addEventListener('touchstart', e => { onStart(e.touches[0].clientX); }, { passive: true });
  track.addEventListener('touchmove', e => { onMove(e.touches[0].clientX); }, { passive: true });
  track.addEventListener('touchend', e => { onEnd(e.changedTouches[0].target); });

  return wrap;
}

(p.blocks || []).forEach(block => {
  const imgs = (block.imgs || []).filter(s => s);
  if (!imgs.length) return;

  let el;
  if (block.type === 'full') {
    el = document.createElement('div');
    el.className = 'block-full';
    el.appendChild(makeImg(imgs[0], true));
  } else if (block.type === 'carousel') {
    el = makeCarousel(imgs);
  } else if (block.type === 'grid2x2') {
    el = document.createElement('div');
    el.className = 'block-grid2x2';
    const grid = document.createElement('div');
    grid.className = 'grid2x2';
    imgs.forEach(src => grid.appendChild(makeImg(src, true)));
    el.appendChild(grid);
  } else if (block.type === '2col') {
    el = document.createElement('div');
    el.className = 'block-2col';
    const row = document.createElement('div');
    row.className = 'row2col';
    imgs.forEach(src => row.appendChild(makeImg(src, true)));
    el.appendChild(row);
  } else if (block.type === '3col') {
    el = document.createElement('div');
    el.className = 'block-3col';
    const row = document.createElement('div');
    row.className = 'row3col';
    imgs.forEach(src => row.appendChild(makeImg(src, true)));
    el.appendChild(row);
  }
  if (el) container.appendChild(el);
});

const nextHref = 'project.html?id=' + nextId;
document.getElementById('next-title').textContent = next.title + ' (' + next.year + ')';
document.getElementById('next-link').href = nextHref;

// ── REVEAL HOME ON SCROLL ──
const wrapper = document.getElementById('page-wrapper');
let overscroll = 0;
const THRESHOLD = 400;
let navigating = false;

window.addEventListener('wheel', e => {
  const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2;
  if (!atBottom || navigating) { if (!atBottom) overscroll = 0; return; }
  overscroll += e.deltaY;
  const progress = Math.max(0, Math.min(overscroll / THRESHOLD, 1));
  wrapper.style.transform = `translateY(-${progress * 80}px)`;
  wrapper.style.opacity = 1 - progress * 0.3;
  if (overscroll >= THRESHOLD) {
    navigating = true;
    wrapper.style.transition = 'transform 0.5s var(--ease), opacity 0.5s ease';
    wrapper.style.transform = 'translateY(-100vh)';
    wrapper.style.opacity = '0';
    setTimeout(() => { window.location.href = 'index.html'; }, 500);
  }
}, { passive: true });

window.addEventListener('scroll', () => {
  const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2;
  if (!atBottom) { overscroll = 0; wrapper.style.transform = ''; wrapper.style.opacity = ''; }
});

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
