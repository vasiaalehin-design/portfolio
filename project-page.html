<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Vasily Alekhin</title>
  <link rel="icon" type="image/png" href="/VA.png" />
  <link rel="stylesheet" href="/_shared.css" />
  <style>
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 30px;
      background: rgba(250,249,247,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: var(--muted);
    }
    .header-nav a { color: var(--muted); text-decoration: none; transition: color .15s; }
    .header-nav a:hover { color: var(--text); }
    .header-nav .comma { margin-right: 12px; }
    .project-intro {
      padding: 80px 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .project-intro-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .project-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(36px, 7vw, 88px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .project-tags {
      display: flex;
      gap: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: var(--muted);
      padding-bottom: 6px;
    }
    .project-nav {
      border-top: 1px solid var(--border);
      padding: 60px 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .project-nav-prev { text-align: left; }
    .project-nav-next { text-align: right; }
    .nav-proj-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .nav-proj-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(20px, 4vw, 48px);
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
      display: block;
      transition: opacity 0.2s;
    }
    .nav-proj-title:hover { opacity: 0.5; }
    .block-full { padding: 4px 30px; }
    .block-full img { width: 100%; display: block; }
    .block-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 30px; }
    .block-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 4px 30px; }
    .block-2col img, .block-3col img { width: 100%; display: block; }
    .scroll-hint { text-align: center; padding: 60px 0 40px; font-size: 20px; color: var(--muted); }
    .divider { height: 1px; background: var(--border); margin: 0 30px; }
    .project-meta { padding: 32px 30px; }
    .meta-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.8;
      color: #444;
      max-width: 560px;
    }
    .back-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color .15s;
      display: inline-block;
      margin-bottom: 24px;
    }
    .back-link:hover { color: var(--text); }
    @media (max-width: 700px) {
      .block-2col, .block-3col { grid-template-columns: 1fr; }
      .project-intro-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>

<div id="overlay"></div>

<header>
  <a href="/" class="site-title" data-link>Vasily Alekhin</a>
  <nav class="header-nav">
    <a href="/" data-link>Work</a><span class="comma">,</span>
    <a href="https://www.instagram.com/vasily.alekhin/" target="_blank">Instagram</a><span class="comma">,</span>
    <a href="https://t.me/vasilyalehin" target="_blank">Telegram</a>
  </nav>
</header>

<main id="main-content">
  <!-- рендерится через JS -->
</main>

<div class="project-nav reveal" id="project-nav">
  <!-- рендерится через JS -->
</div>

<script src="/projects.js"></script>
<script>
  // Определяем какой проект показывать по ?id=
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  const idx = PROJECTS.findIndex(p => p.id === id);
  const project = PROJECTS[idx];

  if (!project) {
    document.getElementById('main-content').innerHTML = '<p style="padding:100px 30px">Project not found</p>';
  } else {
    // Обновляем title
    document.title = project.title + ' — Vasily Alekhin';

    // Рендерим блоки контента
    let blocksHTML = '';
    project.blocks.forEach(block => {
      if (block.type === 'full') {
        blocksHTML += `<div class="block-full reveal"><img src="${block.src}" loading="lazy"></div>`;
      } else if (block.type === '2col') {
        blocksHTML += `<div class="block-2col reveal"><img src="${block.srcs[0]}" loading="lazy"><img src="${block.srcs[1]}" loading="lazy"></div>`;
      } else if (block.type === '3col') {
        blocksHTML += `<div class="block-3col reveal"><img src="${block.srcs[0]}" loading="lazy"><img src="${block.srcs[1]}" loading="lazy"><img src="${block.srcs[2]}" loading="lazy"></div>`;
      }
    });

    document.getElementById('main-content').innerHTML = `
      <div class="project-intro reveal">
        <a href="/" class="back-link" data-link>← BACK</a>
        <div class="project-intro-inner">
          <h1 class="project-title">${project.title} (${project.year})</h1>
          <div class="project-tags">${project.tags.map(t => `<span>${t}</span>`).join('')}</div>
        </div>
      </div>
      <div class="divider reveal"></div>
      <div class="project-meta reveal">
        <p class="meta-label">ABOUT THE PROJECT</p>
        <p class="meta-text">${project.description}</p>
      </div>
      <div class="divider reveal"></div>
      ${blocksHTML}
      <div class="scroll-hint reveal">↓</div>
    `;

    // Рендерим prev/next навигацию
    const prev = PROJECTS[idx - 1];
    const next = PROJECTS[idx + 1];
    let navHTML = '';
    if (prev) {
      navHTML += `<div class="project-nav-prev"><p class="nav-proj-label">PREV PROJECT</p><a href="${prev.url}" class="nav-proj-title" data-link>← ${prev.title} (${prev.year})</a></div>`;
    } else {
      navHTML += '<div></div>';
    }
    if (next) {
      navHTML += `<div class="project-nav-next"><p class="nav-proj-label">NEXT PROJECT</p><a href="${next.url}" class="nav-proj-title" data-link>${next.title} (${next.year}) →</a></div>`;
    } else {
      navHTML += '<div></div>';
    }
    document.getElementById('project-nav').innerHTML = navHTML;
  }
</script>
<script src="/_transitions.js"></script>
</body>
</html>
