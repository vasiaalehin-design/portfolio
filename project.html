<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vasily Alekhin</title>
  <link rel="icon" type="image/png" href="/VA.png" />
  <link rel="stylesheet" href="/_shared.css" />
</head>
<body>

<div id="overlay"></div>

<header>
  <a href="/" class="site-title" data-link>Vasily Alekhin</a>
  <nav class="header-nav">
    <a href="/" data-link>Work</a><span class="comma">,</span>
    <a href="https://www.instagram.com/vasily.alekhin/" target="_blank">Instagram</a><span class="comma">,</span>
    <a href="https://t.me/vasilyalehin" target="_blank">Telegram</a>
  </nav>
</header>

<main id="project-content"></main>
<div class="project-nav reveal" id="project-nav"></div>

<style>
header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 14px 30px; background: rgba(250,249,247,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.header-nav { display: flex; align-items: center; gap: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; color: var(--muted); }
.header-nav a { color: var(--muted); text-decoration: none; transition: color .15s; }
.header-nav a:hover { color: var(--text); }
.header-nav .comma { margin-right: 12px; }
.project-intro { padding: 80px 30px 24px; display: flex; flex-direction: column; gap: 16px; }
.project-intro-inner { display: flex; justify-content: space-between; align-items: flex-end; }
.project-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: clamp(36px, 7vw, 88px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.project-tags { display: flex; gap: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; color: var(--muted); padding-bottom: 6px; }
.project-nav { border-top: 1px solid var(--border); padding: 60px 30px; display: flex; justify-content: space-between; align-items: flex-end; }
.project-nav-prev { text-align: left; }
.project-nav-next { text-align: right; }
.nav-proj-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.nav-proj-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: clamp(20px, 4vw, 36px); font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.01em; display: block; transition: opacity 0.2s; }
.nav-proj-title:hover { opacity: 0.5; }
.block-carousel { position: relative; overflow: hidden; margin: 4px 30px; cursor: grab; }
.block-carousel:active { cursor: grabbing; }
.carousel-track { display: flex; transition: transform 0.4s ease; will-change: transform; }
.carousel-track img { flex: 0 0 100%; width: 100%; display: block; object-fit: cover; pointer-events: none; user-select: none; }
.carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.85); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.2s; opacity: 0; }
.block-carousel:hover .carousel-btn { opacity: 1; }
.carousel-btn.prev { left: 12px; }
.carousel-btn.next { right: 12px; }
.carousel-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); border: none; cursor: pointer; padding: 0; transition: background 0.2s; }
.carousel-dot.active { background: #fff; }
.block-full { padding: 4px 30px; }
.block-full img { width: 100%; display: block; }
.block-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 30px; }
.block-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 4px 30px; }
.block-grid2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 30px; }
.block-2col img, .block-3col img, .block-grid2x2 img { width: 100%; display: block; }
.scroll-hint { text-align: center; padding: 60px 0 40px; font-size: 20px; color: var(--muted); }
.divider { height: 1px; background: var(--border); margin: 0 30px; }
.project-meta { padding: 32px 30px; }
.meta-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.8; color: #444; max-width: 560px; }
.back-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.05em; transition: color .15s; display: inline-block; margin-bottom: 24px; }
.back-link:hover { color: var(--text); }
@media (max-width: 700px) {
  .block-2col, .block-3col, .block-grid2x2 { grid-template-columns: 1fr; }
  .project-intro-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
}
</style>

<script src="/projects.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const keys = Object.keys(projects);
const idx = keys.indexOf(id);
const project = projects[id];

if (!project) {
  document.getElementById('project-content').innerHTML = '<p style="padding:100px 30px">Project not found</p>';
} else {
  document.title = project.title + ' — Vasily Alekhin';
  let blocksHTML = '';
  project.blocks.forEach(block => {
    if (block.type === 'full') {
      blocksHTML += `<div class="block-full reveal"><img src="/${block.imgs[0]}" loading="lazy"></div>`;
    } else if (block.type === 'carousel') {
      const dots = block.imgs.map((_, i) => `<button class="carousel-dot${i===0?' active':''}" data-index="${i}"></button>`).join('');
      const imgs = block.imgs.map(src => `<img src="/${src}" loading="lazy">`).join('');
      blocksHTML += `<div class="block-carousel reveal"><div class="carousel-track">${imgs}</div><button class="carousel-btn prev">&#8249;</button><button class="carousel-btn next">&#8250;</button><div class="carousel-dots">${dots}</div></div>`;
    } else if (block.type === 'grid2x2') {
      blocksHTML += `<div class="block-grid2x2 reveal">${block.imgs.map(s=>`<img src="/${s}" loading="lazy">`).join('')}</div>`;
    } else if (block.type === '2col') {
      blocksHTML += `<div class="block-2col reveal">${block.imgs.map(s=>`<img src="/${s}" loading="lazy">`).join('')}</div>`;
    } else if (block.type === '3col') {
      blocksHTML += `<div class="block-3col reveal">${block.imgs.map(s=>`<img src="/${s}" loading="lazy">`).join('')}</div>`;
    }
  });

  document.getElementById('project-content').innerHTML = `
    <div class="project-intro reveal">
      <a href="/" class="back-link" data-link>&#8592; BACK</a>
      <div class="project-intro-inner">
        <h1 class="project-title">${project.title} (${project.year})</h1>
        <div class="project-tags"><span>${project.cat}</span><span>${project.sub}</span><span>Client: ${project.client}</span></div>
      </div>
    </div>
    <div class="divider reveal"></div>
    <div class="project-meta reveal">
      <p class="meta-label">ABOUT THE PROJECT</p>
      <p class="meta-text">${project.desc || ''}</p>
    </div>
    <div class="divider reveal"></div>
    ${blocksHTML}
    <div class="scroll-hint reveal">&#8595;</div>
  `;

  const prevId = keys[idx - 1];
  const nextId = keys[idx + 1];
  const prevP = prevId ? projects[prevId] : null;
  const nextP = nextId ? projects[nextId] : null;
  let navHTML = '';
  navHTML += prevP ? `<div class="project-nav-prev"><p class="nav-proj-label">PREV PROJECT</p><a href="/project.html?id=${prevId}" class="nav-proj-title" data-link>&#8592; ${prevP.title} (${prevP.year})</a></div>` : '<div></div>';
  navHTML += nextP ? `<div class="project-nav-next"><p class="nav-proj-label">NEXT PROJECT</p><a href="/project.html?id=${nextId}" class="nav-proj-title" data-link>${nextP.title} (${nextP.year}) &#8594;</a></div>` : '<div></div>';
  document.getElementById('project-nav').innerHTML = navHTML;
}
</script>
<script src="/_transitions.js"></script>
<script>
document.addEventListener('click', e => {
  const btn = e.target.closest('.carousel-btn');
  if (!btn) return;
  const carousel = btn.closest('.block-carousel');
  const track = carousel.querySelector('.carousel-track');
  const dots = carousel.querySelectorAll('.carousel-dot');
  const total = track.children.length;
  let current = [...dots].findIndex(d => d.classList.contains('active'));
  if (btn.classList.contains('next')) current = (current + 1) % total;
  else current = (current - 1 + total) % total;
  track.style.transform = `translateX(-${current * 100}%)`;
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
});

document.addEventListener('mousedown', e => {
  const carousel = e.target.closest('.block-carousel');
  if (!carousel) return;
  const track = carousel.querySelector('.carousel-track');
  const dots = carousel.querySelectorAll('.carousel-dot');
  const total = track.children.length;
  let startX = e.clientX;
  let current = [...dots].findIndex(d => d.classList.contains('active'));
  const onMove = ev => { track.style.transition = 'none'; track.style.transform = `translateX(calc(-${current * 100}% + ${ev.clientX - startX}px))`; };
  const onUp = ev => {
    track.style.transition = 'transform 0.4s ease';
    const diff = ev.clientX - startX;
    if (diff < -50) current = Math.min(current + 1, total - 1);
    else if (diff > 50) current = Math.max(current - 1, 0);
    track.style.transform = `translateX(-${current * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

document.addEventListener('touchstart', e => {
  const carousel = e.target.closest('.block-carousel');
  if (!carousel) return;
  const track = carousel.querySelector('.carousel-track');
  const dots = carousel.querySelectorAll('.carousel-dot');
  const total = track.children.length;
  let startX = e.touches[0].clientX;
  let current = [...dots].findIndex(d => d.classList.contains('active'));
  const onMove = ev => { track.style.transition = 'none'; track.style.transform = `translateX(calc(-${current * 100}% + ${ev.touches[0].clientX - startX}px))`; };
  const onEnd = ev => {
    track.style.transition = 'transform 0.4s ease';
    const diff = ev.changedTouches[0].clientX - startX;
    if (diff < -50) current = Math.min(current + 1, total - 1);
    else if (diff > 50) current = Math.max(current - 1, 0);
    track.style.transform = `translateX(-${current * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    carousel.removeEventListener('touchmove', onMove);
    carousel.removeEventListener('touchend', onEnd);
  };
  carousel.addEventListener('touchmove', onMove, { passive: true });
  carousel.addEventListener('touchend', onEnd);
}, { passive: true });
</script>
</body>
</html>
